<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon compte — Koba Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --bg-alt:#141414; --bg-card:#161616;
    --red:#c8102e; --red-hover:#a80d26;
    --white:#f5f5f5; --grey:#9a9a9a; --grey-dim:#6b6b6b;
    --border:#242424; --maxw:1240px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  img{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .display{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:0.5px;}
  .eyebrow{color:var(--red);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}

  header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;max-width:var(--maxw);margin:0 auto;}
  .logo-img{height:38px;width:auto;mix-blend-mode:screen;}
  .nav-links{display:flex;gap:34px;list-style:none;}
  .nav-links a{font-size:13px;font-weight:600;letter-spacing:0.5px;color:var(--grey);transition:color .2s;}
  .nav-links a:hover{color:var(--white);}
  .nav-icons{display:flex;align-items:center;gap:22px;}
  .nav-icons button, .nav-icons a{background:none;color:var(--white);display:flex;align-items:center;}
  .nav-icons a.active{color:var(--red);}
  .cart-btn{position:relative;}
  .cart-count{position:absolute;top:-8px;right:-9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .burger{display:none;background:none;color:var(--white);}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 20px;}

  .auth-card{
    width:100%;max-width:420px;
    background:var(--bg-alt);border:1px solid var(--border);
  }
  .auth-head{text-align:center;padding:36px 32px 0;}
  .auth-head h1{font-size:26px;margin-top:8px;}
  .auth-head p{color:var(--grey-dim);font-size:13px;margin-top:8px;}

  .auth-tabs{display:flex;margin:28px 32px 0;border:1px solid var(--border);}
  .auth-tab{
    flex:1;background:transparent;color:var(--grey);
    padding:12px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    transition:all .2s;
  }
  .auth-tab.active{background:var(--red);color:#fff;}

  .auth-form{padding:28px 32px 36px;display:none;flex-direction:column;gap:16px;}
  .auth-form.active{display:flex;}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--grey);text-transform:uppercase;}
  .field input{
    background:var(--bg);border:1px solid var(--border);color:var(--white);
    padding:12px 14px;font-size:13.5px;font-family:inherit;
    transition:border-color .2s;
  }
  .field input:focus{outline:none;border-color:var(--red);}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  .remember-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--grey);}
  .remember-row label{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .remember-row a{color:var(--grey);text-decoration:underline;}
  .remember-row a:hover{color:var(--white);}

  .submit-btn{
    background:var(--red);color:#fff;padding:14px;
    font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    transition:background .2s;margin-top:4px;
  }
  .submit-btn:hover{background:var(--red-hover);}

  .divider{display:flex;align-items:center;gap:12px;color:var(--grey-dim);font-size:11px;margin:6px 0;}
  .divider::before, .divider::after{content:'';flex:1;height:1px;background:var(--border);}

  .form-note{font-size:11.5px;color:var(--grey-dim);text-align:center;margin-top:4px;}

  footer{padding:24px 0;border-top:1px solid var(--border);text-align:center;font-size:12px;color:var(--grey-dim);}

  @media (max-width:900px){
    .nav-links{display:none;}
    .burger{display:flex;}
    .wrap{padding:0 20px;}
  }
</style>
</head>

<main>
  <div class="auth-card">
    <div class="auth-head">
      <span class="eyebrow">KOBA FITNESS</span>
      <h1 class="display">Mon compte</h1>
      <p>Connecte-toi ou crée un compte pour suivre tes commandes.</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-target="login">Connexion</button>
      <button class="auth-tab" data-target="signup">Inscription</button>
    </div>

    <form class="auth-form active" id="login" onsubmit="return handleAuthSubmit(event, 'Connexion');">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="toi@exemple.com" required>
      </div>
      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <div class="remember-row">
        <label><input type="checkbox" style="width:auto;"> Se souvenir de moi</label>
        <a href="#">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="submit-btn">SE CONNECTER</button>
      <p class="form-note">Pas encore de compte ? <a href="#" onclick="switchTab('signup'); return false;" style="color:var(--white);text-decoration:underline;">Inscris-toi</a></p>
    </form>

    <form class="auth-form" id="signup" onsubmit="return handleAuthSubmit(event, 'Inscription');">
      <div class="field-row">
        <div class="field">
          <label for="signup-firstname">Prénom</label>
          <input type="text" id="signup-firstname" placeholder="Prénom" required>
        </div>
        <div class="field">
          <label for="signup-lastname">Nom</label>
          <input type="text" id="signup-lastname" placeholder="Nom" required>
        </div>
      </div>
      <div class="field">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="toi@exemple.com" required>
      </div>
      <div class="field">
        <label for="signup-password">Mot de passe</label>
        <input type="password" id="signup-password" placeholder="8 caractères minimum" required minlength="8">
      </div>
      <button type="submit" class="submit-btn">CRÉER MON COMPTE</button>
      <p class="form-note">Déjà un compte ? <a href="#" onclick="switchTab('login'); return false;" style="color:var(--white);text-decoration:underline;">Connecte-toi</a></p>
    </form>
  </div>
</main>

<script>
  function switchTab(target){
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.target === target));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.toggle('active', f.id === target));
  }
  document.querySelectorAll('.auth-tab').forEach(tab=>{
    tab.addEventListener('click', ()=> switchTab(tab.dataset.target));
  });

  // ⚠️ Formulaire de démonstration : aucun compte n'est réellement créé/connecté.
  // Pour activer de vrais comptes utilisateurs, il faut brancher un service d'authentification
  // (ex. Firebase Auth, Supabase, ou un backend personnalisé) sur ces formulaires.
  function handleAuthSubmit(event, type){
    event.preventDefault();
    alert(type + " : cette démo front-end n'est pas encore connectée à un système de comptes réel. Il faudra brancher un service d'authentification (Firebase, Supabase, etc.) pour activer de vrais comptes.");
    return false;
  }
</script>
